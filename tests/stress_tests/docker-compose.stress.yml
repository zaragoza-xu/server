services:
  server:
    build:
      context: ../..
      dockerfile: tests/stress_tests/Dockerfile.server
    ports:
      - "8765:8765"
      - "8766:8766"
      - "8767:8767"
      - "8768:8768"
      - "8769:8769"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/8765'"]
      interval: 2s
      timeout: 2s
      retries: 15

  runner:
    build:
      context: ../..
      dockerfile: tests/stress_tests/Dockerfile.runner
    depends_on:
      server:
        condition: service_healthy
    network_mode: service:server
    cap_add:
      - NET_ADMIN
    volumes:
      - ../../tests/stress_tests/output:/workspace/tests/stress_tests/output
    working_dir: /workspace
    environment:
      - NETEM_DEV=eth0
